[package]
name = "happy_accident"
version = "0.1.0"
edition = "2021"
authors = ["BRNB"]
license = "GPL-3.0-or-later"
description = "Happy Accident Generator - by BRNB. Multi-FX aléatoire pour générer des idées de leads."

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "standalone"
required-features = ["standalone"]

[[bin]]
name = "standalone_cr"
required-features = ["standalone"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
hound = "3"
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
